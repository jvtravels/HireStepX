name: Report-scoring eval

on:
  pull_request:
    paths:
      - "server-handlers/_evaluate-session*"
      - "server-handlers/evaluate-session.ts"
      - "server-handlers/_llm*.ts"
      - "data/report-scoring-golden.ts"
  workflow_dispatch:
    inputs:
      threshold:
        description: "Minimum pass rate over conclusive cases (0-1)"
        required: false
        default: "0.8"
  schedule:
    - cron: "0 8 * * 2"

concurrency:
  group: eval-report-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  report-scoring:
    name: Golden-set report scoring
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deterministic checker tests
        run: npx vitest run src/__tests__/reportEvalHelpers.test.ts
      - name: Run golden set through evaluate-session
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          THRESHOLD: ${{ github.event.inputs.threshold || '0.8' }}
        run: |
          set +e
          npx tsx scripts/eval-report-scoring.ts --threshold "$THRESHOLD" --output eval-report.json | tee eval-report.txt
          code=${PIPESTATUS[0]}
          {
            echo "## Report-scoring eval"
            echo ""
            echo '```'
            tail -60 eval-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report-scoring
          path: |
            eval-report.json
            eval-report.txt
          if-no-files-found: ignore
          retention-days: 30
