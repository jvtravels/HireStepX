name: Post-deploy verify

# Runs after Vercel finishes a Production deployment. Detects a bad deploy in
# minutes instead of waiting for users. It reports (fails + opens an issue);
# rollback stays a human decision via Vercel "Instant Rollback".
on:
  deployment_status:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Probe production
        env:
          BASE: https://hirestepx.com
        run: |
          set -u
          fail=0
          for path in / /pricing /login /api/health; do
            code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 20 --retry 3 --retry-delay 5 "$BASE$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || fail=1
          done
          [ "$fail" = "0" ]

      # Browser-level smoke (public pages only, no credentials or writes): the
      # curl probe above only proves the server answers 200, not that the pages
      # actually render or the API contract holds.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke tests (@smoke)
        env:
          BASE_URL: https://hirestepx.com
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
        run: npx playwright test tests/e2e/smoke.spec.ts --project=chromium --reporter=github
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-test-results
          path: test-results/
          retention-days: 14

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.deployment.sha }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Production verification failed for ${SHA:0:7}" \
            --body "Post-deploy probe or smoke test failed. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Consider Vercel Instant Rollback."
