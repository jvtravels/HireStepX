name: Post-deploy verify

# Runs after Vercel finishes a Production deployment. Detects a bad deploy in
# minutes instead of waiting for users. It reports (fails + opens an issue);
# Rollback is automatic only when the repo variable AUTO_ROLLBACK is "true"
# and the VERCEL_TOKEN secret exists; otherwise it stays a human decision via
# Vercel "Instant Rollback".
on:
  deployment_status:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    concurrency:
      group: post-deploy-verify
      cancel-in-progress: false
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Probe production
        env:
          BASE: https://hirestepx.com
        run: |
          set -u
          fail=0
          for path in / /pricing /login /api/health; do
            code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 20 --retry 3 --retry-delay 5 "$BASE$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || fail=1
          done
          [ "$fail" = "0" ]

      # Browser-level smoke (public pages only, no credentials or writes): the
      # curl probe above only proves the server answers 200, not that the pages
      # actually render or the API contract holds.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke tests (@smoke)
        env:
          BASE_URL: https://hirestepx.com
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
        run: npx playwright test tests/e2e/smoke.spec.ts --project=chromium --reporter=github
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-test-results
          path: test-results/
          retention-days: 14

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.deployment.sha }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Production verification failed for ${SHA:0:7}" \
            --body "Post-deploy probe or smoke test failed. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Consider Vercel Instant Rollback."

      # Top-tech pattern: a deploy that fails verification is reverted first and
      # debugged second. Opt-in (variable + secret) so it can't surprise anyone.
      # Skips when the failing deployment is no longer the live one, so a late
      # failure from an old deploy can't roll back a newer good release.
      - name: Auto-rollback to previous production deployment
        if: failure() && vars.AUTO_ROLLBACK == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          GH_TOKEN: ${{ github.token }}
          DEPLOY_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN not set; skipping auto-rollback"; exit 0
          fi
          live=$(npx --yes vercel@latest inspect hirestepx.com --token "$VERCEL_TOKEN" 2>&1 || true)
          dep_host=$(printf '%s' "$DEPLOY_URL" | sed -E 's#https?://##; s#/.*##')
          if ! printf '%s' "$live" | grep -q "$dep_host"; then
            echo "Failing deployment is not the live one; not rolling back"; exit 0
          fi
          npx --yes vercel@latest rollback --token "$VERCEL_TOKEN" --yes
          gh issue comment --repo "$GITHUB_REPOSITORY" "$(gh issue list --repo "$GITHUB_REPOSITORY" --search 'Production verification failed' --state open --limit 1 --json number -q '.[0].number')" \
            --body "Auto-rollback executed by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
