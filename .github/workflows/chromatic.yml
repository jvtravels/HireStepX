name: Chromatic

# Manual-only for now. The automatic push/PR trigger failed on every run: the
# Storybook build in tempo/ (Tempo's generated canvas host) imports
# '@vitejs/plugin-react' from tempo/vite.config.ts but tempo/package.json does
# not declare it, so `storybook build` dies with ERR_MODULE_NOT_FOUND before
# Chromatic ever sees a story. Re-enable push/pull_request once that dependency
# is added to tempo/package.json (regenerated by Tempo, so fix it there).
on:
  workflow_dispatch:

jobs:
  chromatic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tempo
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Chromatic needs full history for baselines

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tempo/package-lock.json

      - run: npm ci

      - name: Publish to Chromatic
        uses: chromaui/action@latest
        with:
          workingDir: tempo
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          exitZeroOnChanges: true
          exitOnceUploaded: true # Don't block CI on snapshot diffs — Chromatic posts a status check on the PR asynchronously
          onlyChanged: true # TurboSnap — skip stories with unchanged dependencies
