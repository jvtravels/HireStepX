name: Lighthouse CI (mobile, production)

# Measures the live site weekly and on demand, so a perf/a11y/SEO regression
# that shipped is caught within a week instead of never. Not a PR gate: PR
# builds are not reachable by URL here, and the old localhost variant failed on
# a CLS assertion and never produced a trustworthy signal.
on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14 autorun --config=./lighthouserc.json
