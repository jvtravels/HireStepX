name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: ESLint (zero errors, warnings capped)
        # Cap includes the new codebase-health warnings introduced in
        # eslint.config.js (max-lines, no-restricted-syntax on `as unknown
        # as X`). Ratchet downward as we fix each hit.
        run: npx eslint . --max-warnings 200

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Run with coverage — thresholds in vitest.config.ts fail the build
      # on regression. Calibrate thresholds upward as coverage improves.
      - run: npm run test:coverage

  replay-negotiation:
    name: Negotiation Replay Harness
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Replays recorded LLM outputs through the failure detector in
      # server-handlers/_negotiation-failures.ts. Fails CI when a fixture
      # turn produces an unexpected failure code (regression) or stops
      # producing one it's supposed to demonstrate (detector drift).
      - run: npm run replay:negotiation

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check bundle sizes
        run: |
          MAX_VENDOR_KB=200
          VENDOR_SIZE=$(du -k dist/assets/vendor-react-*.js | cut -f1)
          echo "vendor-react: ${VENDOR_SIZE}KB (limit: ${MAX_VENDOR_KB}KB)"
          if [ "$VENDOR_SIZE" -gt "$MAX_VENDOR_KB" ]; then
            echo "::warning::vendor-react bundle exceeds ${MAX_VENDOR_KB}KB"
          fi

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    if: ${{ github.event.pull_request.draft == false || github.event_name != 'pull_request' }}
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      NEXT_BUILD_SKIP_SENTRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers (full)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**', 'app/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-
            nextjs-${{ runner.os }}-
      - name: Build app
        run: npm run build
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
