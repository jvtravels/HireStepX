name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: ESLint (zero errors, warnings capped)
        # Cap includes the new codebase-health warnings introduced in
        # eslint.config.js (max-lines, no-restricted-syntax on `as unknown
        # as X`). Ratchet downward as we fix each hit.
        run: npx eslint . --max-warnings 200

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Run with coverage — thresholds in vitest.config.ts fail the build
      # on regression. Calibrate thresholds upward as coverage improves.
      - run: npm run test:coverage

  replay-negotiation:
    name: Negotiation Replay Harness
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Replays recorded LLM outputs through the failure detector in
      # server-handlers/_negotiation-failures.ts. Fails CI when a fixture
      # turn produces an unexpected failure code (regression) or stops
      # producing one it's supposed to demonstrate (detector drift).
      - run: npm run replay:negotiation

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check bundle sizes
        run: |
          MAX_VENDOR_KB=200
          VENDOR_SIZE=$(du -k dist/assets/vendor-react-*.js | cut -f1)
          echo "vendor-react: ${VENDOR_SIZE}KB (limit: ${MAX_VENDOR_KB}KB)"
          if [ "$VENDOR_SIZE" -gt "$MAX_VENDOR_KB" ]; then
            echo "::warning::vendor-react bundle exceeds ${MAX_VENDOR_KB}KB"
          fi

  # NOTE: E2E moved to .github/workflows/e2e.yml — it now runs against the
  # Vercel preview deploy URL (deployment_status trigger), so the runtime
  # env (Supabase, Razorpay, LLM keys) doesn't have to be duplicated as
  # Actions secrets. The job here is intentionally removed; do not add it
  # back to CI unless you also remove it from e2e.yml.
