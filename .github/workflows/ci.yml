name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: ESLint (zero errors, warnings capped)
        # Cap includes the new codebase-health warnings introduced in
        # eslint.config.js (max-lines, no-restricted-syntax on `as unknown
        # as X`). Ratchet downward as we fix each hit.
        run: npx eslint . --max-warnings 200

  security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # --omit=dev: audit only what ships to production. Without it, this
      # gate red-lines on CVEs in @vercel/node's build-time-only toolchain
      # (path-to-regexp ReDoS, minimatch, ajv — exercised by Vercel's deploy
      # pipeline, never by our own runtime code), and the only fix npm
      # offers for those is downgrading @vercel/node to 4.0.0 — a real
      # regression, not a fix. Runtime deps still fail the build on any
      # high/critical finding.
      - name: npm audit (high + critical, production deps)
        run: npm audit --omit=dev --audit-level=high

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Run with coverage — thresholds in vitest.config.ts fail the build
      # on regression. Calibrate thresholds upward as coverage improves.
      - run: npm run test:coverage

  replay-negotiation:
    name: Negotiation Replay Harness
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Replays recorded LLM outputs through the failure detector in
      # server-handlers/_negotiation-failures.ts. Fails CI when a fixture
      # turn produces an unexpected failure code (regression) or stops
      # producing one it's supposed to demonstrate (detector drift).
      - run: npm run replay:negotiation

  negotiation-eval:
    name: Negotiation Eval (structural)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Runs the 20-scenario structural eval and writes the per-scenario
      # scorecard to the GH job summary so PR reviewers see the numbers
      # without opening logs. The vitest gate (EVAL-3) already fails the
      # build on regression — this step exists for visibility, not
      # gating. --json so we can render the summary deterministically.
      - name: Run negotiation eval (--json, write to summary)
        run: |
          set -o pipefail
          # --silent so npm doesn't prefix stdout with "> eval:negotiation\n> tsx..." and break JSON.parse.
          npm run --silent eval:negotiation -- --json > eval.json
          {
            echo "## Negotiation eval — structural scorecard"
            echo
            node -e "
              const r = JSON.parse(require('fs').readFileSync('eval.json','utf8'));
              const s = r.summary;
              console.log('**Suite:** ' + s.fullyPassed + '/' + s.totalScenarios + ' fully passed · average ' + s.averageScore + '/100');
              if (s.worstScenario) console.log('**Worst:** \`' + s.worstScenario.scenario.id + '\` @ ' + s.worstScenario.scorecard.score + '/100');
              console.log('');
              console.log('| Scenario | Score | Status |');
              console.log('| --- | ---: | :---: |');
              for (const sc of r.scenarios) {
                const status = sc.allPassed ? 'pass' : 'FAIL';
                console.log('| \`' + sc.id + '\` | ' + sc.score + '/100 | ' + status + ' |');
              }
              const failed = r.scenarios.flatMap(sc => sc.verdicts.filter(v => v.verdict === 'fail').map(v => ({sc: sc.id, v})));
              if (failed.length) {
                console.log('');
                console.log('### Failed criteria');
                for (const f of failed) console.log('- \`' + f.sc + '\` → **' + f.v.criterionId + '** — ' + f.v.reason);
              }
            "
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check bundle sizes
        run: |
          MAX_VENDOR_KB=200
          VENDOR_SIZE=$(du -k dist/assets/vendor-react-*.js | cut -f1)
          echo "vendor-react: ${VENDOR_SIZE}KB (limit: ${MAX_VENDOR_KB}KB)"
          if [ "$VENDOR_SIZE" -gt "$MAX_VENDOR_KB" ]; then
            echo "::warning::vendor-react bundle exceeds ${MAX_VENDOR_KB}KB"
          fi

  # NOTE: E2E moved to .github/workflows/e2e.yml — it now runs against the
  # Vercel preview deploy URL (deployment_status trigger), so the runtime
  # env (Supabase, Razorpay, LLM keys) doesn't have to be duplicated as
  # Actions secrets. The job here is intentionally removed; do not add it
  # back to CI unless you also remove it from e2e.yml.
